# Oracle Database 23ai Free para PharmaSoft (desarrollo). Autor: Joan Rodriguez
# Levantar:  docker compose up -d      (la primera vez descarga ~1 GB y tarda 1-3 min en estar lista)
# Estado:    docker compose ps         (debe decir "healthy")
# Detener:   docker compose down       (los datos quedan en el volumen; "down -v" los borra)
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: pharmasoft-oracle
    ports:
      - "1522:1521"            # application-dev.yaml usa localhost:1522/FREEPDB1
    environment:
      ORACLE_PASSWORD: Oracle123
      APP_USER: PHARMADB       # se crea en la PDB FREEPDB1
      APP_USER_PASSWORD: "1234567"
    volumes:
      - oracle-datos:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  oracle-datos:
